<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyBank - Home</title>
  <style>
    body { font-family: Arial; margin: 0; background: #f8f9fa; }
    header, footer { background: #002b5c; color: white; text-align: center; padding: 20px; }
    nav { background: #00509e; display: flex; justify-content: center; }
    nav a { color: white; padding: 14px 20px; text-decoration: none; }
    nav a:hover { background: #003f7f; }
    .content { padding: 20px; }
    button { margin: 10px; padding: 10px 15px; }
    form { margin-top: 20px; }
    label { display: block; margin: 10px 0 5px; }
    input[type="text"], input[type="password"], input[type="number"] {
      width: 300px; padding: 8px;
    }
    #resultBox { margin-top: 20px; padding: 10px; background: #e0e0e0; border-left: 5px solid #00509e; }
  </style>
</head>
<body>

<header>
  <h1>Welcome to MyBank</h1>
  <p>Secure Banking at Your Fingertips</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="accounts.html">Accounts</a>
  <a href="services.html">Services</a>
  <a href="profile.html">Profile</a>
</nav>

<div class="content">
  <h2>Quick Actions</h2>
  <button onclick="showRandomBalance()">Check Balance</button>
  <button onclick="showRandomCard()">Show Card Info</button>

  <div id="resultBox"></div>

  <h2>Login Form</h2>
  <form onsubmit="handleLogin(event)">
    <label for="username">Username</label>
    <input type="text" id="username" required>

    <label for="password">Password</label>
    <input type="password" id="password" required>

    <button type="submit">Login</button>
  </form>
</div>

<footer>
  <p>&copy; 2025 MyBank. All rights reserved.</p>
</footer>

<script>
  function showRandomBalance() {
    const balance = (Math.random() * 100000).toFixed(2);
    document.getElementById('resultBox').innerText = "Your current balance is: ₹" + balance;
  }

  function showRandomCard() {
    const cardNum = "XXXX-XXXX-XXXX-" + Math.floor(1000 + Math.random() * 9000);
    const expiry = "0" + Math.floor(1 + Math.random() * 9) + "/2" + Math.floor(5 + Math.random() * 5);
    const cvv = Math.floor(100 + Math.random() * 900);
    document.getElementById('resultBox').innerHTML =
      `<strong>Card Number:</strong> ${cardNum}<br>
       <strong>Expiry:</strong> ${expiry}<br>
       <strong>CVV:</strong> ${cvv}`;
  }

  function handleLogin(event) {
    event.preventDefault();
    const user = document.getElementById('username').value;
    document.getElementById('resultBox').innerText = `Welcome, ${user}! You are now logged in.`;
  }
</script>

</body>
</html>
