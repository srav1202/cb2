<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyBank - Profile</title>
  <style>
    body { font-family: Arial; margin: 0; background: #f8f9fa; }
    header, footer { background: #002b5c; color: white; text-align: center; padding: 20px; }
    nav { background: #00509e; display: flex; justify-content: center; }
    nav a { color: white; padding: 14px 20px; text-decoration: none; }
    nav a:hover { background: #003f7f; }
    .content { padding: 20px; }
    form { max-width: 500px; background: white; padding: 20px; border-radius: 8px; margin: auto; box-shadow: 0 0 10px #ccc; }
    label { display: block; margin: 10px 0 5px; }
    input[type="text"], input[type="email"] { width: 100%; padding: 8px; }
    button { margin-top: 15px; padding: 10px 20px; }
    .message { margin-top: 20px; background: #d4edda; padding: 10px; border-left: 5px solid #28a745; }
  </style>
</head>
<body>

<header>
  <h1>User Profile</h1>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="accounts.html">Accounts</a>
  <a href="services.html">Services</a>
  <a href="profile.html">Profile</a>
</nav>

<div class="content">
  <h2>Update Your Info</h2>
  <form onsubmit="handleProfileUpdate(event)">
    <label for="name">Full Name</label>
    <input type="text" id="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="phone">Phone</label>
    <input type="text" id="phone" required>

    <button type="submit">Update</button>
  </form>

  <div class="message" id="updateMessage"></div>
</div>

<footer>
  <p>&copy; 2025 MyBank. All rights reserved.</p>
</footer>

<script>
  function handleProfileUpdate(event) {
    event.preventDefault();
    const name = document.getElementById('name').value;
    document.getElementById('updateMessage').innerText = `${name}, your profile has been updated successfully.`;
  }
</script>

</body>
</html>
