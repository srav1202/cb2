<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyBank - Services</title>
  <style>
    body { font-family: Arial; margin: 0; background: #f8f9fa; }
    header, footer { background: #002b5c; color: white; text-align: center; padding: 20px; }
    nav { background: #00509e; display: flex; justify-content: center; }
    nav a { color: white; padding: 14px 20px; text-decoration: none; }
    nav a:hover { background: #003f7f; }
    .content { padding: 20px; }
    form { max-width: 500px; background: white; padding: 20px; border-radius: 8px; margin: auto; box-shadow: 0 0 10px #ccc; }
    label { display: block; margin: 10px 0 5px; }
    input[type="text"], input[type="number"] { width: 100%; padding: 8px; }
    button { margin-top: 15px; padding: 10px 20px; }
    .output { margin-top: 20px; background: #e0e0e0; padding: 10px; border-left: 4px solid #00509e; }
  </style>
</head>
<body>

<header>
  <h1>Banking Services</h1>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="accounts.html">Accounts</a>
  <a href="services.html">Services</a>
  <a href="profile.html">Profile</a>
</nav>

<div class="content">
  <h2>Transfer Money</h2>
  <form onsubmit="handleTransfer(event)">
    <label for="from">From Account</label>
    <input type="text" id="from" placeholder="e.g., XXXX-XXXX-0912" required>

    <label for="to">To Account</label>
    <input type="text" id="to" placeholder="e.g., XXXX-XXXX-1823" required>

    <label for="amount">Amount</label>
    <input type="number" id="amount" required>

    <button type="submit">Transfer</button>
  </form>

  <div class="output" id="transferResult"></div>
</div>

<footer>
  <p>&copy; 2025 MyBank. All rights reserved.</p>
</footer>

<script>
  function handleTransfer(event) {
    event.preventDefault();
    const amount = document.getElementById('amount').value;
    const to = document.getElementById('to').value;
    document.getElementById('transferResult').innerText =
      `₹${amount} has been successfully transferred to account ${to}.`;
  }
</script>

</body>
</html>
